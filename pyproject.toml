[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-bdd-tdd-harness"
version = "0.5.0"
description = "Trace requirements, business scenarios, and test evidence."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]
